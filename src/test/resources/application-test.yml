spring:
  datasource:
    url: jdbc:h2:mem:devices_db_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  cache:
    type: none
  kafka:
    bootstrap-servers: localhost:19092
    listener:
      auto-startup: false
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

app:
  kafka:
    consumer-enabled: false

